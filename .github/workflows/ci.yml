name: Synapse CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Clang & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang build-essential time

    - name: Run Test Suite (with AddressSanitizer)
      run: |
        python3 tests/test_compiler.py

    - name: Verify CLI Toolchain
      run: |
        ./bin/syn check examples/prime_counter.syn
        ./bin/syn build examples/fibonacci.syn ./fib_test_bin
        ./fib_test_bin
        ./bin/syn build examples/math_lib.py ./py_math_test_bin
        ./py_math_test_bin

    - name: Run Comparative Benchmark
      run: |
        python3 benchmarks/run_benchmark.py
